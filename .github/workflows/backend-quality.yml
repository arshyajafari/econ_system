name: Backend Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: econ_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: econ_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Check changed PHP formatting
        run: >-
          vendor/bin/pint --test
          app/Actions/Payment/ConfirmPaymentAction.php
          app/Policies/DeliveryPolicy.php
          app/Policies/OrderReturnPolicy.php
          app/Policies/PaymentPolicy.php
          app/Queries/Invoice/InvoiceQuery.php
          app/Security/RoleRegistry.php

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test --without-tty
